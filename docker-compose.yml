# Local Qdrant. The image tag pins the Qdrant version used everywhere.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.1
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      # Named volume: Windows bind mounts through WSL2 can corrupt Qdrant storage.
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
