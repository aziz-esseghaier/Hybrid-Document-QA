# Text reranker over the top pages of the Tomoro visual ranking; same settings as configs/rerank.yaml.
name: rerank_tomoro           # results go to results/<name>/<dataset>
datasets_config: configs/datasets.yaml
model: Qwen/Qwen3-Reranker-4B
revision: 22e683669bc0f0bd69640a1354a6d0aebcfeede5
dtype: float16                # T4 has no bf16
attn_implementation: sdpa     # T4 has no FlashAttention 2
instruction: Given a question, judge whether this document page contains the information that answers it
max_tokens: 4096              # prompt limit; the end of longer pages is cut
batch_size: 4                 # 8 ran out of memory on 4,096-token prompts
candidates: 30                # top pages of the saved visual ranking, reranked per query
candidates_from: results/visual_tomoro_eval/{dataset}/rankings_full.jsonl
part_queries: 16              # queries scored between saves
