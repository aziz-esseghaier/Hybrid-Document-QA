# Visual ranking blended with the text reranker's order of its top 30 pages, chosen on dev.
results_name: fusion_rerank
datasets_config: configs/datasets.yaml
datasets: [v2_esg_reports, v2_esg_reports_human, v2_economics_reports, v2_biomedical_lectures, v1_shiftproject, v1_tabfquad]
qrels: results/qrels/{dataset}.jsonl
rankings:
  visual: results/visual_eval/{dataset}/rankings_qdrant.jsonl
  rerank: results/rerank/{dataset}/rankings_rerank.jsonl     # from rerank_pages.py
rrf_k: 60
page_limit: 100

grid:
  visual: [1]
  rerank: [0.25, 0.5, 1, 2, 4]

baselines:
  visual: {visual: 1}
  rerank: {visual: 1, rerank: 1000}   # reranker order for the top 30, then visual order
compare_with: [visual, rerank]
recall_ks: [5, 10, 20, 30, 50, 100]
bootstrap_resamples: 10000
seed: 0
