# Candidate judges for answer accuracy; one is chosen once by agreement with hand grades, then never changed.
# Unsloth's 4-bit (NF4) copies of the original models: the originals (62 and 48 GB in bf16) don't fit Kaggle's disk.
# The T4 has no bf16, so the 4-bit layers compute in fp16 and the other weights load in fp16.
max_new_tokens: 256           # a short explanation, then the label
retries: 2                    # extra attempts when a reply is not valid JSON with a known label
max_reference_chars: 8000     # up to 28 references (23,000 characters) on a few ESG questions ran out of memory

judges:
  gemma4_31b:                 # google/gemma-4-31B-it @ 842da37
    model: unsloth/gemma-4-31B-it-unsloth-bnb-4bit
    revision: 8e256fc6d63003fc0ca8c91b976e6dcc38433385
    template_kwargs: {enable_thinking: false}
    max_memory: {0: 9GiB, 1: 13GiB}  # room on GPU 0 for the embeddings' activations
  mistral_small_32:           # mistralai/Mistral-Small-3.2-24B-Instruct-2506 @ 95a6d26
    model: unsloth/Mistral-Small-3.2-24B-Instruct-2506-bnb-4bit
    revision: 07735581e6480b532be5e8433813df15108cb66a
    # A fixed system prompt, or the chat template inserts a default one with today's date.
    system_prompt: You grade answers carefully and reply only with the JSON asked for.
    max_memory: {0: 9GiB, 1: 13GiB}  # room on GPU 0 for the embeddings' activations
