# Answer model: reads the top retrieved pages (images and text) and answers with page citations.
name: answer                  # results go to results/<name>_check/<dataset>
datasets_config: configs/datasets.yaml
model: Qwen/Qwen3-VL-8B-Instruct
revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
dtype: float16                # T4 has no bf16
attn_implementation: sdpa_repeat_kv  # T4 has no FlashAttention: plain "sdpa" fell back to the math kernel and ran out of memory
sdpa_backend: EFFICIENT_ATTENTION    # only the memory-efficient kernel; a fall back fails loudly instead
max_memory: {0: 11GiB, 1: 12GiB}  # weights per GPU (about 17.5 GB in fp16); the rest is left for long prompts
rankings:                     # the retrieval setting chosen on dev, by dataset role
  dev: results/fusion_rerank_tomoro_top20/{dataset}/rankings_fused.jsonl
  test: results/fusion_test/{dataset}/rankings_fused.jsonl
test_sample:                  # test only: questions drawn at random per dataset, each with its translations
  questions: 100
  seed: 0
max_text_chars: 4000          # OCR text kept per page (90% of ESG pages have under about 780 tokens)
max_new_tokens: 512
retries: 2                    # extra attempts when a reply breaks the rules
# answer_questions.py answers each question once per setting (pages given x image tokens per page). Chosen on ESG dev
# (results/answer_settings/): 5 x 1280 is within 3 points of the best (not significant) at half its time.
pages: [5]
page_tokens: [1280]           # 32 x 32 pixels per token

check:                        # does the model run on 2 x T4, and at what cost?
  dataset: v2_esg_reports
  seed: 0
  questions: 6                # with all their translations
  pages: [5, 10]              # pages given per question
  page_tokens: [640, 1280]    # image token budget per page (32 x 32 pixels per token)
