# Reuse a dataset's OCR for another dataset with the same pages.
datasets_config: configs/datasets.yaml
target: v2_esg_reports_human
source: v2_esg_reports
# Pages without identical pixels can still match; a wrong match would attach the wrong text, so this is strict.
verify_size: 128
min_ink_share: 0.01
min_pixel_correlation: 0.98
min_margin: 0.02          # best match must beat the second best by this much
workers: null
