# Visual branch with an Apache-2.0 retriever: ColQwen3 (Qwen3-VL-4B), 320-dimension vectors.
name: visual_tomoro           # results go to results/<name>_check, <name>_embeddings, <name>_eval
datasets_config: configs/datasets.yaml
model: TomoroAI/tomoro-colqwen3-embed-4b
revision: 13517a29e8c5e408f7f2684337ed407df3acb212
dtype: float16                # T4 has no bf16
attn_implementation: sdpa     # T4 has no FlashAttention 2
page_batch_size: 1
query_batch_size: 8
part_pages: 64                # pages per saved file; a cut-off run loses at most one file per GPU
pool_factor: 1                # at most 1,280 image tokens of 320 dimensions: a page fits in one Qdrant point
page_limit: 100               # pages kept per ranking
upload_threads: 4             # parallel page uploads to Qdrant
qdrant_timeout: 600           # seconds per request

check:                        # does the model run correctly on this GPU, and at what cost?
  dataset: v2_esg_reports
  seed: 0
  pages: 20                   # one relevant page per question, the rest at random
  questions: 8                # with all their translations
  batch_sizes: [1, 2, 4, 8]   # stops at the first that runs out of memory
  reference_dtype: bfloat16   # the model's own precision, on CPU
  reference_pages: 2          # CPU is slow
  reference_queries: 2
